<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light dark; }
html, body {
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  font-size: 16px;
  color: CanvasText;
  overflow: hidden;
  width: 100%;
}
#editor { width: 100%; }
.ProseMirror {
  outline: none;
  min-height: 40px;
  word-wrap: break-word;
  white-space: pre-wrap;
  -webkit-font-smoothing: antialiased;
  caret-color: CanvasText;
}
.ProseMirror > * + * { margin-top: 4px; }
.ProseMirror h1 { font-size: 24px; font-weight: 700; line-height: 1.3; }
.ProseMirror h2 { font-size: 20px; font-weight: 600; line-height: 1.35; }
.ProseMirror h3 { font-size: 18px; font-weight: 600; line-height: 1.4; }
.ProseMirror p { line-height: 1.5; }
.ProseMirror code {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 14px;
  background: rgba(0,0,0,0.07);
  padding: 1px 4px;
  border-radius: 3px;
}
.ProseMirror pre {
  background: rgba(0,0,0,0.07);
  border-radius: 6px;
  padding: 8px 10px;
  overflow-x: auto;
}
.ProseMirror pre code { background: none; padding: 0; font-size: 14px; }
.ProseMirror ul, .ProseMirror ol { padding-left: 20px; }
.ProseMirror li > p { margin: 0; }
.ProseMirror blockquote {
  border-left: 3px solid rgba(0,0,0,0.2);
  padding-left: 12px;
  color: rgba(0,0,0,0.55);
}
.ProseMirror strong { font-weight: 600; }
.ProseMirror em { font-style: italic; }
.ProseMirror s { text-decoration: line-through; }
.ProseMirror hr { border: none; border-top: 1px solid rgba(0,0,0,0.12); margin: 6px 0; }
@media (prefers-color-scheme: dark) {
  .ProseMirror code { background: rgba(255,255,255,0.12); }
  .ProseMirror pre { background: rgba(255,255,255,0.08); }
  .ProseMirror blockquote { border-left-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.55); }
  .ProseMirror hr { border-top-color: rgba(255,255,255,0.12); }
}
</style>
</head>
<body>
<div id="editor"></div>
<script src="tiptap.min.js"></script>
</body>
</html>
