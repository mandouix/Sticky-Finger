<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light dark; }
:root { --accent: CanvasText; }
html, body {
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  font-size: 15px;
  color: CanvasText;
  overflow-x: hidden;
  overflow-y: auto;
  width: 100%;
}
::-webkit-scrollbar { display: none; }
#editor { width: 100%; padding-left: 4px; }
.ProseMirror {
  outline: none;
  min-height: 40px;
  word-wrap: break-word;
  white-space: pre-wrap;
  -webkit-font-smoothing: antialiased;
  caret-color: CanvasText;
}
.ProseMirror > * + * { margin-top: 10px; }
.ProseMirror > * + :is(h1, h2, h3) { margin-top: 18px; }
.ProseMirror li + li { margin-top: 6px; }
.ProseMirror h1 { font-size: 26px; font-weight: 700; line-height: 1.3; }
.ProseMirror h2 { font-size: 22px; font-weight: 600; line-height: 1.35; }
.ProseMirror h3 { font-size: 17px; font-weight: 600; line-height: 1.4; }
.ProseMirror p { font-size: 15px; line-height: 1.5; }
.ProseMirror code {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 14px;
  background: rgba(0,0,0,0.07);
  padding: 1px 4px;
  border-radius: 3px;
}
.ProseMirror pre {
  background: rgba(0,0,0,0.07);
  border-radius: 6px;
  padding: 8px 10px;
  overflow-x: auto;
}
.ProseMirror pre code { background: none; padding: 0; font-size: 14px; }
/* Lists: headings/paragraphs sit flush left; lists indent into a marker
   column with item text aligned in a single column across ul/ol/tasks. */
.ProseMirror ul { padding-left: 26px; list-style-position: outside; }
.ProseMirror ol { padding-left: 26px; list-style-position: outside; }
.ProseMirror li > p { margin: 0; }
/* Bullet and number accent */
.ProseMirror ul:not([data-type="taskList"]) li::marker { color: var(--accent); }
.ProseMirror ol li::marker { color: var(--accent); font-weight: 600; }
/* Task list */
.ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 0; }
/* gap sized so the label text lands in the same column as bullet/number text. */
.ProseMirror ul[data-type="taskList"] li { display: flex; align-items: flex-start; gap: 13px; }
/* Match the paragraph line box height and center so the checkbox aligns
   vertically with the first line of label text. */
.ProseMirror ul[data-type="taskList"] li > label { display: flex; align-items: center; height: 1.5em; flex-shrink: 0; }
.ProseMirror ul[data-type="taskList"] li > div { flex: 1; }
.ProseMirror ul[data-type="taskList"] input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent);
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  background: transparent;
}
.ProseMirror ul[data-type="taskList"] input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.ProseMirror ul[data-type="taskList"] input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 7px;
  border: 1.5px solid Canvas;
  border-top: none;
  border-left: none;
  transform: translate(-50%, -55%) rotate(45deg);
}
.ProseMirror ul[data-type="taskList"] li[data-checked="true"] > div > p {
  text-decoration: line-through;
  opacity: 0.5;
}
.ProseMirror blockquote {
  border-left: 3px solid rgba(0,0,0,0.2);
  padding-left: 12px;
  color: rgba(0,0,0,0.55);
}
.ProseMirror strong { font-weight: 600; }
.ProseMirror em { font-style: italic; }
.ProseMirror s { text-decoration: line-through; }
.ProseMirror hr { border: none; border-top: 1px solid rgba(0,0,0,0.12); margin: 6px 0; }
.ProseMirror.is-editor-empty > p::before,
.ProseMirror p.is-empty::before {
  content: attr(data-placeholder);
  color: rgba(0,0,0,0.3);
  pointer-events: none;
  float: left;
  height: 0;
}
@media (prefers-color-scheme: dark) {
  .ProseMirror code { background: rgba(255,255,255,0.12); }
  .ProseMirror pre { background: rgba(255,255,255,0.08); }
  .ProseMirror blockquote { border-left-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.55); }
  .ProseMirror hr { border-top-color: rgba(255,255,255,0.12); }
  .ProseMirror.is-editor-empty > p::before,
  .ProseMirror p.is-empty::before { color: rgba(255,255,255,0.3); }
}
</style>
</head>
<body>
<div id="editor"></div>
<script src="tiptap.min.js"></script>
<script>
window.addEventListener('scroll', function() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.update) {
    window.webkit.messageHandlers.update.postMessage({
      scroll: {
        top: window.scrollY,
        bottom: Math.max(0, document.documentElement.scrollHeight - window.scrollY - window.innerHeight)
      }
    });
  }
}, { passive: true });
</script>
</body>
</html>
