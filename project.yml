name: Sticky Finger
options:
  bundleIdPrefix: com.mandarchaudhari
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  Sticky Finger:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sticky Finger
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mandarchaudhari.stickyfinger
        PRODUCT_NAME: "Sticky Finger"
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: "Sticky Finger/Info.plist"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ALWAYS_SEARCH_USER_PATHS: NO
